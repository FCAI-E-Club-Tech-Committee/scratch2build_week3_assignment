<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch2Build Week 3 Assignment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
  <h1>campus event</h1>
  <section>
    <h2>create new event</h2>
    <form id="event-form">
      <label for="title-input">event titles</label>
      <input type="text"
      id="title-input"
      placeholder="enter event title >3 characters"
      >
      <label for="category-input">Category</label>
      <select id="category-input">
        <option value="">select category</option>
        <option value="tech">tech</option>
        <option value="workshop">workshop</option>
        <option value="social">Social</option>

       

      </select>
      <label for ="description-input">Description</label>
      <textarea id="description-input" placeholder="enter event description >10 characters"></textarea>
      
       <button type="submit">add event</button>

    </form>
  </section>
  <section class="filters">
    <h2>explore events</h2>
    <label for="search-input">search</label>
    <input type="text"
    id="search-input"
    placeholder="enter your search keyword">

    <label for="category-select">filter by category</label>
    <select id="category-select">
      <option value="all">All categories</option>
        <option value="tech">tech</option>
        <option value="workshop">workshop</option>
        <option value="social">Social</option>
    </select>
  </section>

  <section class="events-section">
    <h2>availabe events</h2>
    <p id="active-counter">showing 0 events</p>
    <div id="events-container"></div>
    <p id="empty-state">no events found</p>
  </section>
</main>
  
 
<script src="app.js"></script>
</body>
</html>
