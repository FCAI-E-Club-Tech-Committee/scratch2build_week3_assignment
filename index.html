<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch2Build Week 3 Assignment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
   <h1>Events</h1>

  <form id="event-form">
    <input id="title-input" type="text" placeholder="Event title" />
    <select id="category-input">
      <option value="">Select category</option>
      <option value="Tech">Tech</option>
      <option value="Workshop">Workshop</option>
      <option value="Social">Social</option>
    </select>
    <button type="submit">Add Event</button>
  </form>
  <p id="error-message"></p>

  <input id="search-input" type="text" placeholder="Search by title..." />

  <div id="filters">
    <button class="filter-btn active" data-category="All">All</button>
    <button class="filter-btn" data-category="Tech">Tech</button>
    <button class="filter-btn" data-category="Workshop">Workshop</button>
    <button class="filter-btn" data-category="Social">Social</button>
  </div>

  <p id="counter"></p>

  <ul id="event-list"></ul>
  <p id="empty-state" hidden>No events found</p>
<script src="script.js"></script>
</body>
</html>
